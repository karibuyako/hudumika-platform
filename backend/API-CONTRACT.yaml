            required: [channel, amountTZS]
            properties:
              channel: { type: string, enum: [delivery, dine_in, group_buy, pickup] }
              amountTZS: { type: integer }
        byMethod:
          type: array
          items:
            type: object
            required: [method, amountTZS]
            properties:
              method: { type: string }
              amountTZS: { type: integer }
        byTimeOfDay:
          type: array
          items:
            type: object
            required: [period, amountTZS]
            properties:
              period: { type: string, enum: [morning, midday, evening, night] }
              amountTZS: { type: integer }

    BenchmarkSummary:
      type: object
      required: [category]
      properties:
        category: { type: string }
        merchantScore: { type: integer, description: "0–100 store score" }
        industryAverage: { type: integer }
        percentileRank: { type: integer }
        metrics:
          type: array
          items:
            type: object
            required: [metric, merchant, average]
            properties:
              metric: { type: string }
              merchant: { type: number }
              average: { type: number }

    OrderAlertSettings:
      type: object
      properties:
        acceptanceMethod: { type: string, enum: [manual, auto] }
        voiceAlerts: { type: boolean }
        channels: { type: array, items: { type: string, enum: [push, sms, in_app] } }
        quietHours:
          type: object
          properties:
            enabled: { type: boolean }
            from: { type: string, example: "22:00" }
            to: { type: string, example: "08:00" }
        autoAcceptWithinSeconds: { type: integer, minimum: 30, maximum: 300 }

    MerchantDevice:
      type: object
      required: [type, label]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [printer, pos, kitchen_display, cashier_terminal] }
        label: { type: string, maxLength: 80 }
        purpose: { type: string, enum: [receipt, kitchen], default: receipt }
        paperSize: { type: string, enum: ["58mm", "80mm"], default: "80mm" }
        copies: { type: integer, minimum: 1, maximum: 5, default: 1 }
        status: { type: string, enum: [online, offline, error, pairing] }
        settings: { type: object, additionalProperties: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }

    ConversationStatus:
      type: string
      enum: [open, archived, blocked]

    Conversation:
      type: object
      required: [id, merchantId, status, lastMessagePreview, unreadCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        merchantId: { type: string, format: uuid }
        customerUserId: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        subject: { type: string, maxLength: 160 }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        lastMessagePreview: { type: string }
        unreadCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [participants]
          properties:
            participants:
              type: array
              items:
                type: object
                required: [role, displayName]
                properties:
                  role: { type: string, enum: [customer, merchant_staff, system] }
                  displayName: { type: string }
                  maskedPhone: { type: string, nullable: true }

    ConversationCreate:
      type: object
      required: [merchantId, subject, initialMessage]
      properties:
        merchantId: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        subject: { type: string, maxLength: 160 }
        initialMessage: { type: string, maxLength: 2000 }

    ChatMessage:
      type: object
      required: [id, conversationId, authorRole, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        authorRole: { type: string, enum: [customer, merchant_staff, rider, dispatch, provider, provider_staff, system] }
        authorUserId: { type: string, format: uuid, nullable: true }
        body: { type: string, maxLength: 2000 }
        attachments:
          type: array
          items:
            type: object
            required: [mediaType, url]
            properties:
              mediaType: { type: string, enum: [image, document, voice, location] }
              url: { type: string, format: uri }
              locationPin:
                type: object
                nullable: true
                properties:
                  lat: { type: number, format: float }
                  lon: { type: number, format: float }
                  label: { type: string, maxLength: 120 }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ProofOfDelivery:
      type: object
      required: [type, value]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        type: { type: string, enum: [photo, signature, otp] }
        value: { type: string, description: "Photo URL, signature data URL, or OTP code" }
        dropoffOption: { type: string, enum: [hand_to_customer, leave_at_door], default: hand_to_customer }
        itemIds: { type: array, items: { type: string, format: uuid }, description: "Item-wise POD: confirm each item separately" }
        documentUrl: { type: string, format: uri, nullable: true, description: "PDF attachment (delivery note, invoice)" }
        gpsStamp:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
            at: { type: string, format: date-time }
        verified: { type: boolean, default: false }
        submittedAt: { type: string, format: date-time }

    RiderMission:
      type: object
      required: [id, title, targetDeliveries, rewardTZS, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        targetDeliveries: { type: integer }
        completedDeliveries: { type: integer, default: 0 }
        rewardTZS: { type: integer }
        status: { type: string, enum: [active, completed, expired] }
        claimed: { type: boolean, default: false }
        canClaim: { type: boolean, default: false }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    RiderShift:
      type: object
      required: [id, startsAt, status]
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [scheduled, active, completed, cancelled] }
        deliveriesCompleted: { type: integer, default: 0 }
        earningsTZS: { type: integer, default: 0 }
        cashCollectedTZS: { type: integer, default: 0 }
        cashReconciled: { type: boolean, default: false }
        clockedInAt: { type: string, format: date-time, nullable: true }
        clockedOutAt: { type: string, format: date-time, nullable: true }
        forcedRestUntil: { type: string, format: date-time, nullable: true, description: "Mandatory rest — no new assignments until this time" }
        continuousDrivingMinutes: { type: integer, default: 0 }

    DispatchOffer:
      type: object
      required: [orderId, distanceKm, estimatedEarningsTZS, expiresAt]
      properties:
        orderId: { type: string, format: uuid }
        pickup:
          type: object
          required: [lat, lon, address]
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
            address: { type: string }
            merchantName: { type: string }
        dropoff:
          type: object
          required: [lat, lon, address]
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
            address: { type: string }
        distanceKm: { type: number, description: "Pickup + drop-off route distance" }
        predictedPrepMinutes: { type: integer, nullable: true, description: "ML merchant prep-time prediction — dispatch times pickup" }
        addressConfidence: { type: number, nullable: true, description: "Address-disambiguation confidence 0–1" }
        estimatedEarningsTZS: { type: integer }
        itemsSummary: { type: string, maxLength: 120, example: "2x Doro Wot, 3x Injera" }
        paymentMethod: { type: string, enum: [mpesa, tigo_pesa, airtel_money, ezy_pesa, halotel, card, cod, bank] }
        expiresAt: { type: string, format: date-time, description: "Offer window end" }

    FareBreakdown:
      type: object
      required: [orderId, totalTZS]
      properties:
        orderId: { type: string, format: uuid }
        baseTZS: { type: integer, default: 0 }
        distanceTZS: { type: integer, default: 0 }
        timeTZS: { type: integer, default: 0 }
        surgeMultiplier: { type: number, default: 1.0, description: "Peak/weather boost factor applied to base fare" }
        surgeTZS: { type: integer, default: 0 }
        tipTZS: { type: integer, default: 0 }
        codFeeTZS: { type: integer, default: 0, description: "Handling fee on COD orders" }
        waitPayTZS: { type: integer, default: 0, description: "Restaurant wait-time compensation (waitSeconds tracked)" }
        bonusTZS: { type: integer, default: 0, description: "Mission/boost credit" }
        totalTZS: { type: integer }
        currency: { type: string, default: TZS }

    RiderPerformance:
      type: object
      required: [acceptanceRate, onTimePct, ratingAverage, completedOrders]
      properties:
        acceptanceRate: { type: number, description: "0–100" }
        onTimePct: { type: number }
        ratingAverage: { type: number }
        completedOrders: { type: integer }
        earningsTZS: { type: integer }
        safetyScore: { type: integer, description: "0–100 composite" }
        behaviorScore: { type: integer, nullable: true, description: "Telemetry-based; planned" }
        reliabilityScore: { type: integer, nullable: true }
        level: { type: string, enum: [bronze, silver, gold, platinum], default: bronze, description: "Rider star level from performance (Meituan-style)" }
        deliveryStreak: { type: integer, default: 0, description: "Consecutive-day delivery streak" }
        securityScore: { type: integer, nullable: true, description: "Fraud/security score 0–100" }
        avgPerTripTZS: { type: integer, nullable: true }
        topHours: { type: array, items: { type: string }, description: "Best-performing hours of the week" }
        onlineHoursWeek: { type: number, nullable: true }
        levelBenefits:
          type: array
          items: { type: string }
        benchmarks:
          type: object
          properties:
            teamAverage: { type: number, nullable: true }
            fleetAverage: { type: number, nullable: true }
            percentileRank: { type: integer, nullable: true }
        trends:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: number }

    Leaderboard:
      type: object
      required: [metric, period, entries, myEntry]
      properties:
        metric: { type: string, enum: [deliveries, rating, earnings, on_time] }
        period: { type: string, enum: [daily, weekly, monthly] }
        entries:
          type: array
          items:
            type: object
            required: [rank, riderName, value]
            properties:
              rank: { type: integer }
              riderName: { type: string }
              value: { type: number }
        myEntry:
          type: object
          required: [rank, value]
          properties:
            rank: { type: integer }
            value: { type: number }

    HeatmapZone:
      type: object
      required: [zoneId, name, demandLevel]
      properties:
        zoneId: { type: string, format: uuid }
        name: { type: string }
        polygon:
          type: array
          items: { type: string, format: "lon,lat" }
        demandLevel: { type: string, enum: [low, medium, high, critical] }
        surgeMultiplier: { type: number, default: 1.0 }
        activeOrders: { type: integer }
        activeRiders: { type: integer }

    Trip:
      type: object
      required: [id, orderIds, status, stops]
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        orderIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [active, completed, cancelled] }
        stops:
          type: array
          items:
            type: object
            required: [orderId, sequence, stopType, status]
            properties:
              orderId: { type: string, format: uuid }
              sequence: { type: integer }
              stopType: { type: string, enum: [pickup, dropoff] }
              status: { type: string, enum: [pending, arrived, done, failed] }
        routeOptimized: { type: boolean, default: false }
        earningsTZS: { type: integer, default: 0, description: "Batch trip summary earnings (fares + tips + bonuses)" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    RiderCodReconciliation:
      type: object
      required: [riderId, shifts]
      properties:
        riderId: { type: string, format: uuid }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        shifts:
          type: array
          items:
            type: object
            required: [shiftId, date, expectedTZS, collectedTZS, status]
            properties:
              shiftId: { type: string, format: uuid }
              date: { type: string, format: date }
              expectedTZS: { type: integer, description: "COD owed from orders" }
              collectedTZS: { type: integer }
              status: { type: string, enum: [reconciled, pending, mismatch] }
              note: { type: string, nullable: true }
        totals:
          type: object
          properties:
            expectedTZS: { type: integer }
            collectedTZS: { type: integer }
            varianceTZS: { type: integer }

    DestinationFilter:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }
        area: { type: string, maxLength: 120, nullable: true, description: "Named area or landmark" }
        windowFrom: { type: string, format: date-time, nullable: true }
        windowTo: { type: string, format: date-time, nullable: true }
        maxDetourKm: { type: number, default: 5, description: "Dispatch skips orders whose drop-off exceeds this detour" }

    MaskedCallSession:
      type: object
      required: [sessionId, maskedNumber, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        maskedNumber: { type: string, description: "Proxy number; real numbers never exchanged" }
        direction: { type: string, enum: [rider_to_customer, customer_to_rider] }
        expiresAt: { type: string, format: date-time }

    PredictiveDemandZone:
      type: object
      required: [zoneId, name, predictedDemand, confidence]
      properties:
        zoneId: { type: string, format: uuid }
        name: { type: string }
        polygon:
          type: array
          items: { type: string, format: "lon,lat" }
        predictedDemand: { type: string, enum: [low, medium, high, critical] }
        predictedSurgeMultiplier: { type: number, default: 1.0 }
        confidence: { type: number, description: "Model confidence 0–1" }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }

    SafetyEvent:
      type: object
      required: [type, source]
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        type: { type: string, enum: [fatigue_detected, crash_detected, fall_detected, threat_detected, rest_enforced] }
        source: { type: string, enum: [camera, accelerometer, gyroscope, gps, system, manual] }
        severity: { type: string, enum: [info, warning, critical], default: warning }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }
        details: { type: object, additionalProperties: true }
        acknowledged: { type: boolean, default: false }
        emergencyContacted: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }

    SyncStatus:
      type: object
      required: [highWaterMark, pendingCount]
      properties:
        highWaterMark: { type: integer, description: "Server-acknowledged sequence" }
        pendingCount: { type: integer }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        gaps:
          type: array
          items: { type: integer, description: "Missing sequence ranges detected server-side" }

    VehicleMaintenance:
      type: object
      required: [type, performedAt]
      properties:
        id: { type: string, format: uuid }
        riderId: { type: string, format: uuid }
        type: { type: string, enum: [oil_change, tire_pressure, battery_health, brake_service, general_service] }
        performedAt: { type: string, format: date-time }
        mileageKm: { type: integer, nullable: true }
        costTZS: { type: integer, nullable: true }
        notes: { type: string, maxLength: 500 }
        nextDueAt: { type: string, format: date-time, nullable: true, description: "Predictive-maintenance suggestion" }

    RiderGoals:
      type: object
      required: [hoursGoalPerWeek, earningsGoalTZS]
      properties:
        hoursGoalPerWeek: { type: integer, minimum: 1, maximum: 100 }
        earningsGoalTZS: { type: integer }
        weeklyAvailability:
          type: array
          items:
            type: object
            required: [dayOfWeek]
            properties:
              dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
              startTime: { type: string, example: "09:00" }
              endTime: { type: string, example: "18:00" }
        peakHourAlerts: { type: boolean, default: true }

    RiderExpense:
      type: object
      required: [category, amountTZS, incurredAt]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [fuel, maintenance, insurance, equipment, tax_deduction, other] }
        amountTZS: { type: integer }
        receiptUrl: { type: string, format: uri, nullable: true }
        deductible: { type: boolean, default: false }
        note: { type: string, maxLength: 500 }
        incurredAt: { type: string, format: date-time }

    TrustedContact:
      type: object
      required: [name, phone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        phone: { type: string }
        relationship: { type: string, maxLength: 60, nullable: true }
        notifiedOnSos: { type: boolean, default: true }
        shareLocation: { type: boolean, default: true }

    ProviderJobOffer:
      type: object
      required: [bookingId, kind, distanceKm]
      properties:
        bookingId: { type: string, format: uuid }
        kind: { type: string, enum: [nearby, recommended, offer, quote_request] }
        trade: { type: string }
        summary: { type: string, maxLength: 300, description: "Job description + photos count" }
        photoCount: { type: integer, default: 0 }
        distanceKm: { type: number }
        customerArea: { type: string }
        estimatedDurationMinutes: { type: integer }
        estimateLowTZS: { type: integer, nullable: true }
        estimateHighTZS: { type: integer, nullable: true }
        urgency: { type: string, enum: [standard, urgent, emergency], default: standard }
        scheduledFor: { type: string, format: date-time, nullable: true }
        matchScore: { type: number, nullable: true, description: "Matching-engine score 0–1" }
        expiresAt: { type: string, format: date-time, nullable: true }
        reasons: { type: array, items: { type: string }, description: "Why this job was recommended (transparency)" }

    ProviderStaffRole:
      type: string
      enum: [owner, dispatcher, technician, supervisor]

    ProviderStaff:
      type: object
      required: [name, phone, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        phone: { type: string }
        role: { $ref: "#/components/schemas/ProviderStaffRole" }
        capabilities:
          type: array
          items: { type: string, description: "Capability-based permissions; never inherited across roles" }
        status: { type: string, enum: [invited, active, suspended] }
        createdAt: { type: string, format: date-time }

    ProviderService:
      type: object
      required: [name, durationMinutes, pricing]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        trade: { type: string }
        durationMinutes: { type: integer, minimum: 15 }
        pricing:
          type: object
          required: [baseTZS]
          properties:
            baseTZS: { type: integer, description: "Base service fee" }
            perHourTZS: { type: integer, nullable: true }
            tripFeeTZS: { type: integer, default: 0 }
            partsIncluded: { type: boolean, default: false }
        active: { type: boolean, default: true }
        createdAt: { type: string, format: date-time }

    BookingEstimate:
      type: object
      required: [serviceId, lowTZS, highTZS, tripFeeTZS]
      properties:
        serviceId: { type: string, format: uuid }
        lowTZS: { type: integer }
        highTZS: { type: integer }
        tripFeeTZS: { type: integer }
        estimatedDurationMinutes: { type: integer }
        disclaimer: { type: string, maxLength: 300, description: "Final quote may vary after on-site inspection" }

    BookingQuote:
      type: object
      required: [laborTZS, tripFeeTZS]
      properties:
        laborTZS: { type: integer }
        tripFeeTZS: { type: integer }
        parts:
          type: array
          items: { $ref: "#/components/schemas/PartsLine" }
        expiresAt: { type: string, format: date-time, nullable: true }
        note: { type: string, maxLength: 500 }

    ProofOfService:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [photo, signature, notes, otp] }
        value: { type: string, description: "Photo URL, signature, notes, or customer OTP" }
        gpsStamp:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
            at: { type: string, format: date-time }

    PartsLine:
      type: object
      required: [name, quantity, unitCostTZS]
      properties:
        name: { type: string, maxLength: 120 }
        quantity: { type: integer, minimum: 1 }
        unitCostTZS: { type: integer }
        catalogueItemId: { type: string, format: uuid, nullable: true, description: "Links to provider parts inventory" }

    ServiceInvoice:
      type: object
      required: [id, bookingId, laborTZS, totalTZS, status]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        laborTZS: { type: integer }
        tripFeeTZS: { type: integer }
        partsTZS: { type: integer }
        discountTZS: { type: integer }
        taxTZS: { type: integer }
        totalTZS: { type: integer }
        status: { type: string, enum: [draft, issued, paid] }
        note: { type: string, nullable: true }
        issuedAt: { type: string, format: date-time }

    ServiceWarranty:
      type: object
      required: [bookingId, validDays]
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        validDays: { type: integer, minimum: 1 }
        coverage: { type: string, maxLength: 1000 }
        followUpAt: { type: string, format: date-time, nullable: true, description: "Scheduled follow-up" }
        status: { type: string, enum: [active, expired, claimed] }
        issuedAt: { type: string, format: date-time }

    Technician:
      type: object
      required: [name, phone, trade]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        phone: { type: string }
        trade: { type: string }
        skills: { type: array, items: { type: string } }
        status: { type: string, enum: [idle, on_job, offline], default: idle }
        currentBookingId: { type: string, format: uuid, nullable: true }
        certifications: { type: array, items: { $ref: "#/components/schemas/Certification" } }
        rating: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }

    Certification:
      type: object
      required: [type, number]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: "electrician_license" }
        number: { type: string }
        issuer: { type: string, maxLength: 120 }
        issuedAt: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        documentUrl: { type: string, format: uri, nullable: true }
        verified: { type: boolean, default: false }
        status: { type: string, enum: [pending, verified, rejected, expired] }

    ServiceCategoryConfig:
      type: object
      required: [id, name, pricingModel]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Plumbing" }
        requiredSkills: { type: array, items: { type: string } }
        requiredCertifications: { type: array, items: { type: string } }
        pricingModel: { type: string, enum: [fixed, hourly, quote, dynamic] }
        defaultDurationMinutes: { type: integer }
        questionnaireTemplate: { type: array, items: { $ref: "#/components/schemas/ServiceQuestion" } }
        requiredPhotos: { type: integer, default: 0 }
        requiredEquipment: { type: array, items: { type: string } }
        cancellationRules: { type: string, maxLength: 500 }
        warrantyDays: { type: integer, default: 0 }
        commissionBps: { type: integer, default: 0 }

    ServiceQuestion:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, example: "leak_or_blockage" }
        label: { type: string }
        type: { type: string, enum: [text, single_choice, multi_choice, number, boolean, photo, video] }
        required: { type: boolean, default: false }
        options: { type: array, items: { type: string }, nullable: true }

    ProviderInventoryItem:
      type: object
      required: [name, stockOnHand]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        category: { type: string, enum: [part, consumable, equipment, tool], default: part }
        stockOnHand: { type: integer }
        lowStockThreshold: { type: integer, default: 5 }
        unitCostTZS: { type: integer, nullable: true }
        assignedTechnicianId: { type: string, format: uuid, nullable: true, description: "Tool/equipment assignment" }
        updatedAt: { type: string, format: date-time }

    ServicePlan:
      type: object
      required: [name, serviceId, frequency, priceTZS]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        serviceId: { type: string, format: uuid }
        frequency: { type: string, enum: [weekly, biweekly, monthly, quarterly, annually] }
        priceTZS: { type: integer }
        active: { type: boolean, default: true }
        customerCount: { type: integer, default: 0 }
        createdAt: { type: string, format: date-time }

    ServiceContract:
      type: object
      required: [organizationName, coveredServices, slaResponseMinutes]
      properties:
        id: { type: string, format: uuid }
        organizationName: { type: string, maxLength: 160 }
        locations: { type: array, items: { type: string } }
        coveredServices: { type: array, items: { type: string } }
        slaResponseMinutes: { type: integer }
        slaResolutionMinutes: { type: integer, nullable: true }
        pricing: { type: object, additionalProperties: true }
        coverageArea: { type: array, items: { type: string } }
        workingHours: { type: string, maxLength: 120 }
        escalationRules: { type: string, maxLength: 500 }
        status: { type: string, enum: [draft, active, expired, cancelled] }
        createdAt: { type: string, format: date-time }

    ProviderDocument:
      type: object
      required: [id, type, status, url]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [identity, license, certificate, insurance, tax, registration, vehicle, background_check, training] }
        url: { type: string, format: uri }
        status: { type: string, enum: [uploaded, processing, verified, rejected, expiring, expired] }
        expiryDate: { type: string, format: date, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }

    TrustProfile:
      type: object
      required: [trustScore, riskScore]
      properties:
        trustScore: { type: integer, description: "0–100" }
        riskScore: { type: integer, description: "0–100" }
        flags:
          type: array
          items: { type: string, enum: [off_platform_payment, price_manipulation, false_completion, fake_reviews, location_spoofing, repeated_cancellation, account_sharing, identity_mismatch] }
        verifiedBadge: { type: boolean, default: false }
        tier: { type: string, enum: [bronze, silver, gold, platinum], default: bronze }

    PortfolioItem:
      type: object
      required: [url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        kind: { type: string, enum: [photo, video] }
        caption: { type: string, maxLength: 300 }
        serviceId: { type: string, format: uuid, nullable: true }
        addedAt: { type: string, format: date-time }

    CopilotRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [explain_job, diagnose_photos, suggest_quote, recommend_materials, generate_message, summarize_history, schedule_optimization, predict_travel_time, detect_suspicious_completion] }
        bookingId: { type: string, format: uuid, nullable: true }
        photos: { type: array, items: { type: string, format: uri }, nullable: true }
        jobSummary: { type: string, maxLength: 2000, nullable: true }
        historyMonths: { type: integer, default: 3 }
        language: { type: string, default: en }

    Hub:
      type: object
      required: [id, name, cityId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        cityId: { type: string, format: uuid }
        address: { type: string, maxLength: 300 }
        capacity: { type: integer, nullable: true }
        active: { type: boolean, default: true }

    RouteSegment:
      type: object
      required: [legId, sequence, type, status]
      properties:
        legId: { type: string, format: uuid }
        sequence: { type: integer }
        type: { type: string, enum: [first_mile, linehaul, hub_transfer, last_mile, return] }
        mode: { type: string, enum: [motorcycle, car, van, linehaul_bus, linehaul_truck] }
        fromHubId: { type: string, format: uuid, nullable: true }
        toHubId: { type: string, format: uuid, nullable: true }
        handledBy: { type: string, description: "riderId or carrierId (third-party line-haul)" }
        status: { type: string, enum: [pending, in_progress, completed, skipped] }
        plannedStartAt: { type: string, format: date-time, nullable: true }
        plannedEndAt: { type: string, format: date-time, nullable: true }
        etaAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        custody:
          type: object
          nullable: true
          properties:
            from: { type: string }
            to: { type: string }
            sealIntact: { type: boolean }
            at: { type: string, format: date-time }

    WaybillEvent:
      type: object
      required: [at, type, location]
      properties:
        at: { type: string, format: date-time }
        type: { type: string, enum: [scanned, handoff, loaded, departed, arrived, sorted, exception, delivered] }
        location: { type: string }
        actor: { type: string, description: "rider/carrier/hub staff/system" }
        note: { type: string, nullable: true }

    Handoff:
      type: object
      required: [fromLegId, toLegId, scanCode, sealIntact]
      properties:
        id: { type: string, format: uuid }
        fromLegId: { type: string, format: uuid }
        toLegId: { type: string, format: uuid }
        scanCode: { type: string, description: "Waybill/barcode scan at custody transfer" }
        sealIntact: { type: boolean, description: "Tamper-evident seal check — must be true" }
        conditionPhotoUrl: { type: string, format: uri, nullable: true }
        location:
          type: object
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
        from: { type: string, description: "Handing-off party (rider/carrier/hub)" }
        to: { type: string }
        at: { type: string, format: date-time }

    Consignment:
      type: object
      required: [id, consignmentNumber, fromHubId, toHubId, transportMode, status]
      properties:
        id: { type: string, format: uuid }
        consignmentNumber: { type: string }
        fromHubId: { type: string, format: uuid }
        toHubId: { type: string, format: uuid }
        transportMode: { type: string, enum: [van, linehaul_bus, linehaul_truck] }
        carrierId: { type: string, format: uuid, nullable: true, description: "Line-haul rider or third-party carrier" }
        orderCount: { type: integer }
        manifest:
          type: array
          items:
            type: object
            required: [orderId, waybillNumber, section]
            properties:
              orderId: { type: string, format: uuid }
              waybillNumber: { type: string }
              section: { type: string, enum: [standard, fragile, cold_chain, documents, high_value] }
              scannedIn: { type: boolean, default: false }
              scannedOut: { type: boolean, default: false }
        status: { type: string, enum: [manifesting, in_transit, at_hub, delivered, cancelled] }
        scheduledDeparture: { type: string, format: date-time, nullable: true }
        departedAt: { type: string, format: date-time, nullable: true }
        arrivedAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    Shipment:
      type: object
      required: [id, shipmentNumber, orderId, status]
      properties:
        id: { type: string, format: uuid }
        shipmentNumber: { type: string, example: "SH-2026-000091829" }
        orderId: { type: string, format: uuid }
        packages:
          type: array
          items: { $ref: "#/components/schemas/Package" }
        containerId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [planned, picked_up, at_hub, in_transit, out_for_delivery, delivered, exception, frozen] }
        frozenReason: { type: string, nullable: true }
        frozenAt: { type: string, format: date-time, nullable: true }
        currentLegId: { type: string, format: uuid, nullable: true }
        declaredValueTZS: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    Package:
      type: object
      required: [id, packageId, shipmentId, attributes]
      properties:
        id: { type: string, format: uuid }
        packageId: { type: string, example: "PKG-7F92A8" }
        shipmentId: { type: string, format: uuid }
        containerId: { type: string, format: uuid, nullable: true }
        attributes:
          type: object
          required: [compatible]
          properties:
            temperature: { type: string, enum: [ambient, cold_chain, frozen], default: ambient }
            fragile: { type: boolean, default: false }
            hazardous: { type: boolean, default: false }
            highValue: { type: boolean, default: false }
            maxTransitHours: { type: integer, nullable: true }
            allowedModes: { type: array, items: { type: string, enum: [motorcycle, car, van, linehaul_bus, linehaul_truck, refrigerated_truck] } }
            weightKg: { type: number, nullable: true }
            volumeL: { type: number, nullable: true }
            compatible: { type: boolean, default: true }
        status: { type: string, enum: [prepared, picked_up, at_hub, loaded, in_transit, sorted, out_for_delivery, delivered, exception] }
        scannedIn: { type: boolean, default: false }
        scannedOut: { type: boolean, default: false }

    Container:
      type: object
      required: [id, containerId, kind]
      properties:
        id: { type: string, format: uuid }
        containerId: { type: string, example: "BAG-CN-000391" }
        kind: { type: string, enum: [bag, cage, pallet, lockbox, refrigerated_unit] }
        section: { type: string, enum: [standard, fragile, cold_chain, documents, high_value] }
        packageIds: { type: array, items: { type: string, format: uuid } }
        sealed: { type: boolean, default: false }
        sealCode: { type: string, nullable: true }
        sealedAt: { type: string, format: date-time, nullable: true }
        currentTripId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    Vehicle:
      type: object
      required: [id, vehicleType, registration]
      properties:
        id: { type: string, format: uuid }
        vehicleType: { type: string, enum: [motorcycle, e_bike, bicycle, car, van, linehaul_bus, linehaul_truck, refrigerated_truck] }
        registration: { type: string }
        operatorId: { type: string, format: uuid, nullable: true, description: "Driver/rider or carrier" }
        capacity:
          type: object
          properties:
            totalUnits: { type: integer }
            maxWeightKg: { type: number, nullable: true }
            maxVolumeL: { type: number, nullable: true }
            compartments:
              type: array
              items:
                type: object
                required: [name, capacity]
                properties:
                  name: { type: string, enum: [standard, fragile, cold_chain, documents, high_value] }
                  capacity: { type: integer }
                  used: { type: integer, default: 0 }
                  usedWeightKg: { type: number, default: 0 }
                  usedVolumeL: { type: number, default: 0 }
        temperatureCapable: { type: boolean, default: false }
        securityCapability: { type: string, enum: [none, lockbox, cage, armored], default: none }
        permittedRoutes: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [active, on_trip, maintenance, retired] }
        currentLocation:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
            updatedAt: { type: string, format: date-time }
        currentTripId: { type: string, format: uuid, nullable: true }

    Route:
      type: object
      required: [id, name, fromHubId, toHubId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Dar es Salaam → Mwanza" }
        fromHubId: { type: string, format: uuid }
        toHubId: { type: string, format: uuid }
        estimatedHours: { type: integer }
        scheduledDepartures: { type: array, items: { type: string, example: "18:30" } }
        permittedVehicles: { type: array, items: { type: string, enum: [van, linehaul_bus, linehaul_truck, refrigerated_truck] } }
        active: { type: boolean, default: true }

    LogisticsTrip:
      type: object
      required: [id, tripNumber, routeId, vehicleId, status]
      properties:
        id: { type: string, format: uuid }
        tripNumber: { type: string, example: "TRP-9912" }
        routeId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        consignmentIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [planned, loading, in_transit, unloading, completed, cancelled] }
        manifestSummary:
          type: object
          properties:
            expectedUnits: { type: integer }
            verifiedUnits: { type: integer }
            exceptions: { type: integer }
        scheduledDeparture: { type: string, format: date-time, nullable: true }
        departedAt: { type: string, format: date-time, nullable: true }
        arrivedAt: { type: string, format: date-time, nullable: true }
        driverId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    CustodyEntry:
      type: object
      required: [id, shipmentId, eventType, at]
      properties:
        id: { type: string, format: uuid }
        shipmentId: { type: string, format: uuid }
        packageId: { type: string, nullable: true }
        eventType: { type: string, enum: [picked_up, hub_in, sorted, container_loaded, vehicle_loaded, departed, arrived, unloaded, handoff, out_for_delivery, delivered] }
        actorId: { type: string, format: uuid }
        actorType: { type: string, enum: [rider, driver, hub_worker, carrier, system] }
        locationId: { type: string, nullable: true }
        vehicleId: { type: string, format: uuid, nullable: true }
        hubId: { type: string, format: uuid, nullable: true }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }
        deviceId: { type: string, nullable: true }
        previousState: { type: string, nullable: true }
        newState: { type: string }
        evidence: { type: string, nullable: true }
        at: { type: string, format: date-time }

    ReconciliationResult:
      type: object
      required: [consignmentId, expected, scanned, status]
      properties:
        consignmentId: { type: string, format: uuid }
        expected: { type: integer }
        scanned: { type: integer }
        missingOrderIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [matched, mismatch] }
        tripClosed: { type: boolean }

    TrackingPhase:
      type: object
      required: [phase, label, status]
      properties:
        phase: { type: string, enum: [confirmed, picked_up, in_transit, arrived_city, out_for_delivery, delivered] }
        label: { type: string }
        status: { type: string, enum: [pending, active, completed] }
        at: { type: string, format: date-time, nullable: true }
        eta: { type: string, format: date-time, nullable: true }

    ControlTower:
      type: object
      required: [generatedAt, totals, criticalExceptions]
      properties:
        generatedAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            activeShipments: { type: integer }
            delayed: { type: integer }
            exceptions: { type: integer }
            atRisk: { type: integer }
            activeTrips: { type: integer }
            tripsByHub:
              type: array
              items:
                type: object
                required: [hubName, trips]
                properties:
                  hubName: { type: string }
                  trips: { type: integer }
        criticalExceptions:
          type: array
          items:
            type: object
            required: [shipmentId, type]
            properties:
              shipmentId: { type: string }
              type: { type: string, enum: [wrong_hub_scan, vehicle_delayed, package_missing, rider_no_show, seal_broken, reconciliation_failed] }
              detail: { type: string, nullable: true }

    Warehouse:
      type: object
      required: [id, name, cityId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        cityId: { type: string, format: uuid }
        address: { type: string, maxLength: 300 }
        lat: { type: number, format: float, nullable: true }
        lon: { type: number, format: float, nullable: true }
        servingCities: { type: array, items: { type: string, format: uuid } }
        stock:
          type: array
          items:
            type: object
            required: [catalogueItemId, quantity]
            properties:
              catalogueItemId: { type: string, format: uuid }
              quantity: { type: integer }
        status: { type: string, enum: [active, full, maintenance] }
        createdAt: { type: string, format: date-time }

    Carrier:
      type: object
      required: [id, name, modes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        modes: { type: array, items: { type: string, enum: [van, linehaul_bus, linehaul_truck, refrigerated_truck, train, air] } }
        regions: { type: array, items: { type: string } }
        apiIntegration: { type: string, maxLength: 200, nullable: true, description: "Integration handle (webhooks/API)" }
        status: { type: string, enum: [active, paused, suspended] }
        createdAt: { type: string, format: date-time }

    Facility:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        address: { type: string, maxLength: 300 }
        geofence:
          type: array
          items: { type: string, format: "lon,lat" }
        whitelistRiderIds: { type: array, items: { type: string, format: uuid }, description: "Fixed-rider credential access — pre-approved for entry" }
        accessPolicy: { type: string, enum: [whitelist_only, whitelist_or_otp, open], default: whitelist_only }
        createdAt: { type: string, format: date-time }

    FleetAccount:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        ownerUserId: { type: string, format: uuid }
        driverSubAccountIds: { type: array, items: { type: string, format: uuid }, description: "One master account, many driver sub-accounts (RiderPrivate.fleetAccountId)" }
        vehicles: { type: array, items: { type: string, format: uuid } }
        regions: { type: array, items: { type: string } }
        permissions:
          type: object
          additionalProperties: { type: boolean }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }

    DeliveryExceptionKind:
      type: string
      enum:
        - missing_package
        - wrong_package
        - wrong_hub
        - wrong_vehicle
        - scan_failure
        - damaged_package
        - late_vehicle
        - vehicle_breakdown
        - rider_unavailable
        - bus_cancellation
        - hub_congestion
        - weather_disruption
        - road_closure
        - customer_unavailable
        - package_refused
        - route_deviation
        - security_incident
        - reconciliation_failure

    DeliveryException:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DeliveryExceptionKind" }
        shipmentId: { type: string, format: uuid, nullable: true }
        orderId: { type: string, format: uuid, nullable: true }
        tripId: { type: string, format: uuid, nullable: true }
        description: { type: string, maxLength: 1000 }
        reportedBy: { type: string }
        status: { type: string, enum: [open, resolving, resolved, escalated] }
        outcome: { type: string, maxLength: 1000, nullable: true }
        autoReplanned: { type: boolean, default: false, description: "Plan was recalculated automatically" }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    SearchResults:
      type: object
      required: [query, results]
      properties:
        query: { type: string }
        results:
          type: array
          items:
            type: object
            required: [entityType]
            properties:
              entityType: { type: string, enum: [restaurant, dish, product, store, provider, service_package, hotel, deal] }
              id: { type: string, format: uuid }
              title: { type: string }
              subtitle: { type: string, nullable: true }
              rating: { type: number, nullable: true }
              priceTZS: { type: integer, nullable: true }
              distanceKm: { type: number, nullable: true }
              etaMinutes: { type: integer, nullable: true }
              imageUrl: { type: string, format: uri, nullable: true }
              badges: { type: array, items: { type: string } }
        total: { type: integer }
        nextCursor: { type: string, nullable: true }

    AdminBanner:
      type: object
      required: [id, title, placement]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        imageUrl: { type: string, format: uri }
        description: { type: string, maxLength: 500 }
        link: { type: string, nullable: true }
        placement: { type: string, enum: [home_top, home_middle, category, checkout, activity] }
        active: { type: boolean, default: false }
        scheduledFrom: { type: string, format: date-time, nullable: true }
        scheduledTo: { type: string, format: date-time, nullable: true }
        clicks: { type: integer, default: 0 }
        impressions: { type: integer, default: 0 }
        createdAt: { type: string, format: date-time }

    AdminTemplate:
      type: object
      required: [key, channel]
      properties:
        key: { type: string, example: "order_confirmation" }
        channel: { type: string, enum: [email, sms, push, in_app] }
        subject: { type: string, maxLength: 160, nullable: true }
        body: { type: string, maxLength: 10000 }
        variables:
          type: array
          items: { type: string }
        active: { type: boolean, default: true }
        updatedAt: { type: string, format: date-time }

    AdminCommissionRule:
      type: object
      required: [scopeType, rateBps]
      properties:
        id: { type: string, format: uuid }
        scopeType: { type: string, enum: [category, merchant, provider] }
        scopeId: { type: string, format: uuid, nullable: true, description: "Category/merchant/provider id" }
        rateBps: { type: integer }
        active: { type: boolean, default: true }
        updatedAt: { type: string, format: date-time }

    AdminFeatureFlag:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        rolloutPct: { type: number, minimum: 0, maximum: 1, default: 1 }
        betaOnly: { type: boolean, default: false }
        targeting:
          type: object
          nullable: true
          description: "Country/region/city/segment/percentage rollout"
          properties:
            countries: { type: array, items: { type: string } }
            regions: { type: array, items: { type: string } }
            cities: { type: array, items: { type: string, format: uuid } }
            segments: { type: array, items: { type: string, format: uuid } }
