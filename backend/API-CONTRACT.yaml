        orderNotificationChannels: { type: array, items: { type: string, enum: [push, sms, in_app] } }
        acceptedPaymentMethods: { type: array, items: { type: string, enum: [mpesa, tigo_pesa, airtel_money, ezy_pesa, halotel, card, cod, bank] } }
        deliverySettings:
          type: object
          properties:
            radiusKm: { type: number }
            deliveryFeeTZS: { type: integer }
            minimumOrderTZS: { type: integer }
