components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff sessions additionally require MFA claim.

  responses:
    Unauthorized:
      description: Missing, expired, or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated but lacks permission for this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found or not visible to the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: State transition not allowed in the current status
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: "ORDER_NOT_CANCELLABLE" }
        message: { type: string, example: "Order can no longer be cancelled" }
        requestId: { type: string, format: uuid }
        retryAfterSeconds: { type: integer }

    ValidationResponse:
      type: object
      required: [code, message, requestId, errors]
      properties:
        code: { type: string, example: "VALIDATION_FAILED" }
        message: { type: string }
        requestId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: "items[0].price" }
              message: { type: string }

    OtpDelivery:
      type: object
      required: [requestId, expiresInSeconds]
      properties:
        requestId: { type: string, format: uuid }
        expiresInSeconds: { type: integer, example: 300 }
        resendInSeconds: { type: integer, example: 60 }

    Session:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    TwoFaEnrollResult:
      type: object
      required: [secret, otpauthUrl, recoveryCodes]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret (SHA-1, 30s step, 6 digits)
        otpauthUrl:
          type: string
          format: uri
          description: otpauth:// URI for authenticator apps
        qrDataUrl:
          type: string
          nullable: true
          description: Base64 data URL of a QR rendering; null when the server does not render QR images
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
          description: Single-use recovery codes (only their hashes are stored server-side)

    TwoFaVerifyBody:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6, example: "123456" }

    TwoFaVerifyResult:
      type: object
      required: [enabled, recoveryCodes]
      properties:
        enabled: { type: boolean, const: true }
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
          description: Fresh single-use recovery codes, returned exactly once

    TwoFaSessionResult:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Access token carrying the mfa_verified claim
        refreshToken: { type: string }

    TwoFaDisableBody:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6, example: "123456" }

    TwoFaRecoveryBody:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Single-use recovery code }
        newPassword:
          type: string
          minLength: 8
          description: Reserved for a future password-reset extension; ignored by the current server

    User:
      type: object
      required: [id, phone, roles, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        email: { type: string, nullable: true }
        fullName: { type: string }
        avatarUrl: { type: string, nullable: true }
        activeRole: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleSummary" }
        locale: { type: string, default: en }
        createdAt: { type: string, format: date-time }

    UserUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        avatarUrl: { type: string, format: uri }
        locale: { type: string, enum: [en, sw, ar] }

    RoleSummary:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [customer, merchant, provider, rider]
        merchantId: { type: string, format: uuid, nullable: true }
        providerId: { type: string, format: uuid, nullable: true }
        riderId: { type: string, format: uuid, nullable: true }

    City:
      type: object
      required: [id, name, country]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string, default: TZ }
        serviceAreas:
          type: array
          items: { $ref: "#/components/schemas/ServiceArea" }

    ServiceArea:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        polygon: { type: array, items: { type: string, format: "lon,lat" } }

    Service:
      type: object
      required: [id, category, name]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        unit: { type: string, enum: [per_order, per_hour, per_visit, per_item] }

    MerchantApplication:
      type: object
      required: [businessName, contactPhone, city]
      properties:
        businessName: { type: string, maxLength: 160 }
        contactPhone: { type: string }
        contactEmail: { type: string, format: email }
        city: { type: string }
        businessType:
          type: string
          enum: [restaurant, shop, grocery, pharmacy, retail, tickets, other]
        description: { type: string, maxLength: 2000 }

    ProviderApplication:
      type: object
      required: [name, phone, trade, city]
      properties:
        name: { type: string, maxLength: 120 }
        phone: { type: string }
        email: { type: string, format: email }
        trade:
          type: string
          enum: [plumbing, electrical, cleaning, repairs, carpentry, painting, beauty, wellness, fitness, education, automotive, pet_care, health_care, events, property, other]
        city: { type: string }
        serviceArea: { type: string }
        bio: { type: string, maxLength: 2000 }

    RiderApplication:
      type: object
      required: [name, phone, city]
      properties:
        name: { type: string, maxLength: 120 }
        phone: { type: string }
        email: { type: string, format: email }
        city: { type: string }
        vehicle:
          type: string
          enum: [motorcycle, bicycle, car]
        hasSmartphone: { type: boolean }
        documentsNote: { type: string, maxLength: 500 }

    LeadCreated:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [submitted, under_review] }
        createdAt: { type: string, format: date-time }

    LeadCreate:
      type: object
      required: [type, name, phone, email]
      properties:
        type: { type: string, enum: [merchant, provider, rider, feedback] }
        name: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, format: email }
        companyName: { type: string, maxLength: 120, description: "Business name (merchant leads)" }
        city: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 4000 }
        source: { type: string, maxLength: 40, description: "Origin of the lead, e.g. public-frontend" }
        topic: { type: string, maxLength: 80, description: "Feedback topic (feedback leads)" }
        restaurant: { type: string, maxLength: 120, description: "Restaurant name (merchant leads)" }
        owner: { type: string, maxLength: 120, description: "Owner name (merchant leads)" }
        businessType: { type: string, maxLength: 60, description: "Business type (merchant leads)" }
        outlets: { type: integer, minimum: 1, description: "Outlet count (merchant leads)" }
        comment: { type: string, maxLength: 4000, description: "Merchant lead comment" }
        trade: { type: string, maxLength: 120, description: "Trade/specialty (provider leads)" }
        experience: { type: integer, minimum: 0, description: "Years of experience (provider leads)" }
        bio: { type: string, maxLength: 2000, description: "Provider bio" }
        vehicle: { type: string, maxLength: 80, description: "Vehicle type (rider leads)" }
        availability: { type: string, maxLength: 120, description: "Availability (rider leads)" }
        referral: { type: string, maxLength: 40, description: "Referral code" }

    MerchantPublic:
      type: object
      required: [id, businessName, city, rating, reviewCount, isOpen]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        logoUrl: { type: string, nullable: true }
        city: { type: string }
        serviceAreas: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        rating: { type: number, format: float }
        reviewCount: { type: integer }
        isOpen: { type: boolean }
        deliveryMinutes: { type: integer, nullable: true }

    RecommendedMerchant:
      type: object
      required: [merchantId, businessName, rating, reviewCount, reason]
      properties:
        merchantId: { type: string, format: uuid }
        businessName: { type: string }
        rating: { type: number, format: float }
        reviewCount: { type: integer }
        reason: { type: string, description: "Server-owned reason, rendered verbatim" }
        deliveryMinutes: { type: integer, nullable: true }
        score: { type: number, format: float, nullable: true, description: "Ranking score for debugging, not rendered" }

    MerchantPrivate:
      allOf:
        - $ref: "#/components/schemas/MerchantPublic"
        - type: object
          required: [verification, commercial]
          properties:
            verification:
              $ref: "#/components/schemas/VerificationState"
            permissions:
              type: array
              items: { type: string }
              description: Effective capability set for the caller's merchant role. '*' means full access; other entries mirror the app's role capability matrix.
            commercial:
              type: object
              properties:
                commissionRateBps: { type: integer }
                payoutCycleDays: { type: integer, default: 3 }
                payoutAccount: { type: string }

    MerchantUpdate:
      type: object
      properties:
        businessName: { type: string, maxLength: 160 }
        logoUrl: { type: string, format: uri }
        description: { type: string, maxLength: 2000 }
        serviceAreas: { type: array, items: { type: string } }
        isOpen: { type: boolean }
        address: { type: string, maxLength: 300 }
        contactPhone: { type: string }

    MerchantAdmin:
      allOf:
        - $ref: "#/components/schemas/MerchantPrivate"
        - type: object
          required: [documents, openedAt]
          properties:
            documents:
              type: array
              items:
                type: object
                required: [type, status]
                properties:
                  type: { type: string }
                  status: { type: string, enum: [missing, pending, approved, rejected] }
            openedAt: { type: string, format: date-time, nullable: true }

    VerificationState:
      type: string
      enum: [pending, documents_review, approved, rejected, suspended, changes_requested]

    ProviderPublic:
      type: object
      required: [id, name, trade, rating, reviewCount, verified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        trade: { type: string }
        avatarUrl: { type: string, nullable: true }
        rating: { type: number, format: float }
        reviewCount: { type: integer }
        verified: { type: boolean }
        serviceAreas: { type: array, items: { type: string } }
        baseRateTZS: { type: integer }

    ProviderPrivate:
      allOf:
        - $ref: "#/components/schemas/ProviderPublic"
        - type: object
          required: [verification, payoutCycleDays]
          properties:
            verification: { $ref: "#/components/schemas/VerificationState" }
            payoutCycleDays: { type: integer, default: 7 }
            bio: { type: string }
            availability:
              type: array
              items: { $ref: "#/components/schemas/AvailabilityWindow" }
            # Enterprise P3: Dianping Manager model — tradeRequirements, NIDA/liveness, UBO/sanctions
            tradeRequirements:
              type: array
              nullable: true
              items:
                type: object
                required: [trade, requiredDocuments]
                properties:
                  trade: { type: string }
                  requiredDocuments: { type: array, items: { type: string } }
                  requiredCertifications: { type: array, items: { type: string } }
                  sanctionsScreening: { type: boolean, default: true }
                  uboThresholdPct: { type: integer, default: 25 }
            kycVerification:
              type: object
              nullable: true
              properties:
                nidaNumber: { type: string }
                nidaVerified: { type: boolean, default: false }
                livenessScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
                livenessResult: { type: string, enum: [pass, fail, pending], default: pending }
                status: { type: string, enum: [unverified, pending, verified, rejected, expired], default: unverified }
                sanctionsStatus: { type: string, enum: [clear, flagged, pending], default: pending }
                uboStatus: { type: string, enum: [not_required, pending, clear, flagged], default: not_required }

    ProviderUpdate:
      type: object
      properties:
        bio: { type: string, maxLength: 2000 }
        baseRateTZS: { type: integer }
        avatarUrl: { type: string, format: uri }
        serviceAreas: { type: array, items: { type: string } }

    ProviderAdmin:
      allOf:
        - $ref: "#/components/schemas/ProviderPrivate"
        - type: object
          required: [documents, reliabilityScore]
          properties:
            documents:
              type: array
              items:
                type: object
                required: [type, status]
                properties:
                  type: { type: string }
                  status: { type: string, enum: [missing, pending, approved, rejected] }
            reliabilityScore: { type: integer, minimum: 0, maximum: 100 }

    AvailabilityWindow:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string, example: "09:00" }
        endTime: { type: string, example: "18:00" }
        active: { type: boolean, default: true }

    RiderPrivate:
      type: object
      required: [id, name, city, vehicle, verification, online]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        vehicle: { type: string, enum: [motorcycle, bicycle, car] }
        transportMode: { type: string, enum: [local_motorcycle, local_car, van, linehaul_bus, linehaul_truck, relay], default: local_motorcycle, description: "Rider role by means of transport; line-haul riders handle consignments, local riders handle single orders" }
        serviceModel: { type: string, enum: [specialized, crowdsourced, errand, fleet], default: specialized, description: "Meituan-style models: specialized (专送) contracted, crowdsourced (众包), errand (跑腿), or fleet company driver" }
        fleetAccountId: { type: string, format: uuid, nullable: true, description: "Fleet master-account sub-account linkage (one master account, many driver sub-accounts)" }
        licensePlate: { type: string, nullable: true }
        vehicleMake: { type: string, nullable: true }
        vehicleYear: { type: integer, nullable: true }
        verification: { $ref: "#/components/schemas/VerificationState" }
        online: { type: boolean }
        onlineSince: { type: string, format: date-time, nullable: true }
        rating: { type: number, format: float, nullable: true }
        reviewCount: { type: integer, default: 0 }
        deliveryZone: { type: string }
        merchantIds: { type: array, items: { type: string, format: uuid }, description: "Businesses this rider is mapped to (role mapping)" }
        hubId: { type: string, format: uuid, nullable: true, description: "Distribution hub (multi-hub operations)" }
        fleetType: { type: string, enum: [captive, contracted, outsourced, hybrid], default: captive }
        employmentType: { type: string, enum: [full_time, part_time], default: full_time }
        ratingFilterMin: { type: number, nullable: true }
        availability:
          type: object
          nullable: true
          properties:
            preferredDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
            preferredStart: { type: string, example: "09:00" }
            preferredEnd: { type: string, example: "18:00" }
            maxHoursPerDay: { type: integer, default: 12 }
        lastLocation:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
            updatedAt: { type: string, format: date-time }

    RiderUpdate:
      type: object
      properties:
        deliveryZone: { type: string }
        vehicle: { type: string, enum: [motorcycle, bicycle, car] }
        licensePlate: { type: string }
        vehicleMake: { type: string }
        vehicleYear: { type: integer }
        hubId: { type: string, format: uuid }
        fleetType: { type: string, enum: [captive, contracted, outsourced, hybrid] }
        transportMode: { type: string, enum: [local_motorcycle, local_car, van, linehaul_bus, linehaul_truck, relay], description: "Rider role by means of transport; changes require the mode license/verification" }
        employmentType: { type: string, enum: [full_time, part_time] }
        ratingFilterMin: { type: number, nullable: true, description: "Only accept orders from customers rated ≥ this" }
        availability:
          type: object
          properties:
            preferredDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
            preferredStart: { type: string, example: "09:00" }
            preferredEnd: { type: string, example: "18:00" }
            maxHoursPerDay: { type: integer, minimum: 1, maximum: 24 }

    RiderAdmin:
      type: object
      required: [id, name, city, vehicle, verification, documents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        vehicle: { type: string }
        licensePlate: { type: string, nullable: true }
        vehicleMake: { type: string, nullable: true }
        vehicleYear: { type: integer, nullable: true }
        verification: { $ref: "#/components/schemas/VerificationState" }
        documents:
          type: array
          items:
            type: object
            required: [type, status]
            properties:
              type: { type: string }
              status: { type: string, enum: [missing, pending, approved, rejected] }
        reliabilityScore: { type: integer, minimum: 0, maximum: 100 }

    Catalogue:
      type: object
      required: [merchantId, items]
      properties:
        merchantId: { type: string, format: uuid }
        publishedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogueItem" }

    CatalogueItem:
      type: object
      required: [name, priceTZS, category]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        priceTZS: { type: integer, minimum: 0 }
        originalPriceTZS: { type: integer, nullable: true, description: "Compare-at price for savings display" }
        costTZS: { type: integer, nullable: true, description: "Unit cost for margin analytics" }
        category: { type: string }
        imageUrl: { type: string, format: uri, nullable: true }
        videoUrl: { type: string, format: uri, nullable: true, description: "Product videos" }
        emoji: { type: string, maxLength: 8, nullable: true }
        available: { type: boolean, default: true }
        zeroStockAction: { type: string, enum: [hide, show_sold_out], default: show_sold_out }
        sort: { type: integer, default: 0 }
        options:
          type: array
          items:
            type: object
            required: [name, choices]
            properties:
              name: { type: string }
              choices:
                type: array
                items:
                  type: object
                  required: [label, priceTZS]
                  properties:
                    label: { type: string }
                    priceTZS: { type: integer }
        addons:
          type: array
          items:
            type: object
            required: [name, priceTZS]
            properties:
              name: { type: string, maxLength: 80 }
              priceTZS: { type: integer }
              emoji: { type: string, maxLength: 8, nullable: true }
        comboItems:
          type: array
          items:
            type: object
            required: [catalogueItemId, quantity]
            properties:
              catalogueItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }

    CatalogueItemUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        priceTZS: { type: integer, minimum: 0 }
        available: { type: boolean }
        videoUrl: { type: string, format: uri }
        options: { type: array, items: { $ref: "#/components/schemas/CatalogueItem" } }

    OrderStatus:
      type: string
      enum:
        - draft
        - pending_payment
        - paid
        - merchant_accepted
        - preparing
        - rider_assigned
        - rider_arrived_pickup
        - picked_up
        - delivering
        - rider_arrived_dropoff
        - delivered
        - completed
        - failed_delivery
        - returning
        - rescheduled
        - timed_out
        - cancelled
        - refunded
        - failed
        - disputed

    BookingStatus:
      type: string
      enum:
        - draft
        - pending_payment
        - paid
        - validating
        - matching
        - offered
        - provider_requested
        - provider_accepted
        - scheduled
        - reminder_sent
        - en_route
        - provider_arrived
        - check_in
        - diagnosing
        - quote_required
        - quote_submitted
        - quote_accepted
        - in_progress
        - completion_review
        - awaiting_customer_confirmation
        - completed
        - settled
        - warranty
        - declined
        - cancelled
        - customer_cancelled
        - provider_cancelled
        - refunded
        - disputed
        - escalated
        - reassignment
        - no_show
        - provider_late

    OrderCreate:
      type: object
      required: [merchantId, items, paymentMethod]
      properties:
        merchantId: { type: string, format: uuid }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [catalogueItemId, quantity]
            properties:
              catalogueItemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              options: { type: array, items: { type: string } }
        paymentMethod:
          type: string
          enum: [mpesa, tigo_pesa, airtel_money, ezy_pesa, halotel, card, cod, bank]
        deliveryAddress: { $ref: "#/components/schemas/AddressSnapshot" }
        note: { type: string, maxLength: 500 }
        scheduledAt: { type: string, format: date-time, nullable: true, description: "Advance (pre-scheduled) orders" }
        couponId: { type: string, format: uuid, description: "Optional coupon applied at checkout; server validates it and echoes the discount via totals.discountTZS" }

    AddressSnapshot:
      type: object
      required: [label, lines, contactPhone]
      properties:
        label: { type: string, example: "Home" }
        lines: { type: string, maxLength: 500 }
        landmark: { type: string, maxLength: 200 }
        lat: { type: number, format: float }
        lon: { type: number, format: float }
        contactPhone: { type: string }

    Order:
      type: object
      required: [id, status, merchantId, totals, createdAt]
      properties:
        id: { type: string, format: uuid }
        no: { type: string, description: "Human-readable order number" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        merchantId: { type: string, format: uuid }
        storeId: { type: string, format: uuid, nullable: true }
        riderId: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [app, web, phone, pos], default: app }
        version: { type: integer, description: "Optimistic-concurrency version; mutations send expectedVersion" }
        scheduledAt: { type: string, format: date-time, nullable: true }
        rushRequestedAt: { type: string, format: date-time, nullable: true }
        rushCooldownMinutes: { type: integer, default: 1, description: "Second rush within cooldown keeps deadline unchanged" }
        rushRepliedAt: { type: string, format: date-time, nullable: true }
        preOrderReminderSent: { type: boolean, default: false, description: "Persists on the order row after the ≤15 min reminder" }
        rejectReason: { type: string, nullable: true }
        rejectReasonCode: { type: string, nullable: true }
        tipTZS: { type: integer, default: 0, description: "Rider tip (打赏) received on this order" }
        waitSeconds: { type: integer, default: 0, description: "Restaurant wait time tracked by the wait timer" }
        waitPayTZS: { type: integer, default: 0, description: "Wait-time compensation" }
        itemsChecked: { type: boolean, default: false, description: "Item-wise verification completed on this order" }
        priority: { type: string, enum: [normal, express, vip], default: normal, description: "Priority tagging; VIP/express orders take precedence in dispatch and list sorting" }
        fulfillmentType: { type: string, enum: [local, intercity, relay], default: local, description: "intercity = hub-to-hub with line-haul; relay = sequential rider handoffs" }
        dispatchStrategy: { type: string, enum: [nearest, zone, multi_leg, relay, warehouse], description: "Strategy-pattern dispatch: instant uses nearest; cross-city uses multi_leg; warehouse-fulfilled uses warehouse" }
        fulfillmentSource: { type: string, enum: [merchant, warehouse], default: merchant, description: "Regional-warehouse model: nearest warehouse ships when inventory is pre-positioned" }
        waybillNumber: { type: string, nullable: true, description: "Tracking number across all legs" }
        routeSegments:
          type: array
          description: "Multi-leg journey (first mile, line-haul, hub transfer, last mile)"
          items: { $ref: "#/components/schemas/RouteSegment" }
        promoCode: { type: string, nullable: true, description: "Rider promo order — bonus credited on completion" }
        cancelReason: { type: string, nullable: true }
        deadlineAt: { type: string, format: date-time, nullable: true, description: "Acceptance deadline; auto-cancel after" }
        seen: { type: boolean, default: false }
        freeDelivery: { type: boolean, default: false }
        deliveryEtaMin: { type: integer, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        readyAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        settledAt: { type: string, format: date-time, nullable: true }
        totals: { $ref: "#/components/schemas/PriceBreakdown" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PriceBreakdown:
      type: object
      required: [subtotalTZS, deliveryFeeTZS, platformFeeTZS, taxTZS, discountTZS, totalTZS]
      properties:
        subtotalTZS: { type: integer }
        deliveryFeeTZS: { type: integer }
        platformFeeTZS: { type: integer }
        taxTZS: { type: integer }
        discountTZS: { type: integer }
        totalTZS: { type: integer }

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [events, deliveryAddress]
          properties:
            items:
              type: array
              items:
                type: object
                required: [catalogueItemId, name, quantity, unitPriceTZS]
                properties:
                  catalogueItemId: { type: string, format: uuid }
                  name: { type: string }
                  quantity: { type: integer }
                  unitPriceTZS: { type: integer }
            deliveryAddress: { $ref: "#/components/schemas/AddressSnapshot" }
            deliveryWindowFrom: { type: string, format: date-time, nullable: true, description: "Server-computed delivery window start (ISO)" }
            deliveryWindowTo: { type: string, format: date-time, nullable: true, description: "Server-computed delivery window end (ISO)" }
            originCityName: { type: string, nullable: true, description: "Route origin city label (intercity/relay shipments)" }
            destinationCityName: { type: string, nullable: true, description: "Route destination city label (intercity/relay shipments)" }
            events:
              type: array
              items: { $ref: "#/components/schemas/OrderEvent" }

    OrderEvent:
      type: object
      required: [status, at, by]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        at: { type: string, format: date-time }
        by: { type: string, example: "system|merchant|rider|customer" }
        note: { type: string }

    TrackingEvent:
      type: object
      required: [status, updatedAt]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        riderLocation:
          type: object
          properties:
            lat: { type: number, format: float }
            lon: { type: number, format: float }
        updatedAt: { type: string, format: date-time }
        estimateMinutes: { type: integer }
        stageEtas:
          type: object
          nullable: true
          description: "Deep-learning ETA per delivery stage"
          properties:
            merchantArrival: { type: integer, nullable: true }
            pickup: { type: integer, nullable: true }
            dropoff: { type: integer, nullable: true }

    BookingCreate:
      type: object
      required: [providerId, serviceId, scheduledFor, paymentMethod]
      properties:
        providerId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        scheduledFor: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 15, maximum: 480 }
        paymentMethod: { type: string, enum: [mpesa, tigo_pesa, airtel_money, ezy_pesa, halotel, card, cod, bank] }
        address: { $ref: "#/components/schemas/AddressSnapshot" }
        description: { type: string, maxLength: 2000 }
        photos: { type: array, items: { type: string, format: uri }, maxItems: 6, description: "Pre-visit job photos so the provider can prepare tools/parts" }
        videos: { type: array, items: { type: string, format: uri }, maxItems: 3, description: "Pre-visit job videos" }
        answers: { type: object, additionalProperties: true, description: "Dynamic questionnaire answers per service category" }
        contractId: { type: string, format: uuid, nullable: true }

    Booking:
      type: object
      required: [id, status, providerId, serviceId, scheduledFor, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        providerId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        scheduledFor: { type: string, format: date-time }
        technicianId: { type: string, format: uuid, nullable: true, description: "Assigned technician" }
        contractId: { type: string, format: uuid, nullable: true, description: "B2B service contract" }
        recurringPlanId: { type: string, format: uuid, nullable: true, description: "Recurring service plan" }
        slaDeadlineAt: { type: string, format: date-time, nullable: true, description: "SLA response/resolution deadline" }
        quoteStatus: { type: string, enum: [provisional, quote_issued, quote_approved, quote_declined], default: provisional }
        price: { $ref: "#/components/schemas/PriceBreakdown" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookingDetail:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          required: [events, address]
          properties:
            address: { $ref: "#/components/schemas/AddressSnapshot" }
            description: { type: string }
            events:
              type: array
              items:
                type: object
                required: [status, at, by]
                properties:
                  status: { $ref: "#/components/schemas/BookingStatus" }
                  at: { type: string, format: date-time }
                  by: { type: string }
                  note: { type: string }

    PaymentIntentCreate:
      type: object
      required: [orderId, method]
      properties:
        orderId: { type: string, format: uuid, description: "Order or booking id" }
        method: { type: string, enum: [mpesa, tigo_pesa, airtel_money, ezy_pesa, halotel, card, cod, bank] }

    PaymentIntent:
      type: object
      required: [id, status, amountTZS, method]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [created, pending, paid, failed, refunded, partially_refunded]
        amountTZS: { type: integer }
        method: { type: string }
        providerReference: { type: string, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }

    PayoutSummary:
      type: object
      required: [id, amountTZS, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        amountTZS: { type: integer }
        status:
          type: string
          enum: [pending, processing, paid, failed, exception]
        method: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }

    PayoutBatch:
      type: object
      required: [id, cycle, status, totalTZS, count]
      properties:
        id: { type: string, format: uuid }
        cycle: { type: string, example: "2026-08-12" }
        status: { type: string, enum: [draft, processing, settled, exception] }
        totalTZS: { type: integer }
        count: { type: integer }
        exceptions: { type: integer }

    LedgerEntry:
      type: object
      required: [id, type, amountTZS, balanceTZS, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [order_earning, booking_earning, delivery_fee, commission, adjustment, payout, refund, bonus, tip]
        amountTZS: { type: integer }
        balanceTZS: { type: integer }
        referenceType: { type: string }
        referenceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    LedgerStatement:
      type: object
      required: [from, to, entries]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        openingBalanceTZS: { type: integer }
        closingBalanceTZS: { type: integer }
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }

    ReviewCreate:
      type: object
      required: [targetType, targetId, rating, body]
      properties:
        targetType: { type: string, enum: [merchant, provider, rider, customer] }
        targetId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 2000 }
        dimensions:
          type: object
          nullable: true
          description: "Multi-dimensional ratings (home services)"
          properties:
            professionalism: { type: integer, minimum: 1, maximum: 5 }
            punctuality: { type: integer, minimum: 1, maximum: 5 }
            quality: { type: integer, minimum: 1, maximum: 5 }
            communication: { type: integer, minimum: 1, maximum: 5 }
            priceTransparency: { type: integer, minimum: 1, maximum: 5 }
            cleanliness: { type: integer, minimum: 1, maximum: 5 }
            wouldRecommend: { type: boolean }

    Review:
      type: object
      required: [id, targetType, targetId, rating, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        authorName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        state: { type: string, enum: [pending, published, hidden, deleted] }
        createdAt: { type: string, format: date-time }
        reply: { $ref: "#/components/schemas/ReviewReply", nullable: true, description: "Merchant/provider/rider reply to this review, when one exists" }
