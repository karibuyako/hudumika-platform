  /riders/me/sync/batch:
    post:
      tags: [riders]
      summary: Offline sync — idempotent batch upsert with sequence numbers
      operationId: syncRiderBatch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [seq, type, payload]
                    properties:
                      seq: { type: integer, description: "Monotonic client sequence number" }
                      type:
                        type: string
                        enum: [order_status, pod, location, safety_event, cod_cash]
                      payload: { type: object, additionalProperties: true }
                      capturedAt: { type: string, format: date-time }
                idempotencyKey: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected, highWaterMark]
                properties:
                  accepted: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [seq, code]
                      properties:
                        seq: { type: integer }
                        code: { type: string }
                  highWaterMark: { type: integer, description: "Server-acknowledged sequence; client drops ≤ this" }
        "422": { $ref: "#/components/responses/ValidationError" }

