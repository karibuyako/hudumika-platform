openapi: 3.1.0
info:
  title: HUDumika API
  version: 1.0.0
  description: >
    Single source of truth for all HUDumika applications. Consumers are the
    customer app, merchant web/mobile, provider web/mobile, rider app, and the
    private admin web. Public web serves as a marketing layer only.

    Base URL for all paths: /api/v1 (do not add version numbers to resource names).

    Conventions:
    - All timestamps are UTC ISO 8601; clients render local time.
    - All mutations require server-side validation and role authorization.
    - Payments, order creation, and bookings require idempotency keys.
    - Pagination is cursor-based: ?limit=20&cursor=<opaque>.
    - Errors return a stable error code plus message and request ID.
    - Money is integer minor units of TZS (tanzanian shillings, 1 TZS = 1 unit).
  termsOfService: https://hudumika.co.tz/legal
  contact:
    name: HUDumika Engineering
servers:
  - url: https://hudumika-api-production.up.railway.app/api/v1
    description: Production (Railway)
  - url: https://staging-api.hudumika.co.tz/api/v1
    description: Staging
  - url: https://api.hudumika.co.tz/api/v1
    description: Production (custom domain — future)

tags:
  - name: auth
  - name: users
  - name: cities
  - name: services
  - name: merchants
  - name: providers
  - name: riders
  - name: catalogues
  - name: orders
  - name: bookings
  - name: payments
  - name: payouts
  - name: reviews
  - name: notifications
  - name: support
  - name: admin
  - name: public

paths:
  /auth/request-otp:
    post:
      tags: [auth]
      summary: Request a one-time password by phone or email
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, destination]
              properties:
                channel: { type: string, enum: [phone, email] }
                destination: { type: string, example: "+255712345678" }
                purpose:
                  type: string
                  enum: [login, signup, register, password_reset, verify_role]
                  default: login
      responses:
        "200":
          description: OTP sent (or rate-limited silently). Never reveal whether the account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpDelivery"
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/verify-otp:
    post:
      tags: [auth]
      summary: Verify OTP and issue a session
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, code]
              properties:
                requestId: { type: string, format: uuid }
                code: { type: string, minLength: 4, maxLength: 8 }
                role:
                  type: string
                  enum: [customer, merchant, provider, rider, staff]
                  description: Requested session role. Defaults to the active role (or customer). A role with no active role row answers 422 ROLE_NOT_ACTIVE.
      responses:
        "200":
          description: Session created. Role-scoped token; role switch requires a new verify call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate an access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204": { description: Revoked }

  /auth/2fa/enroll:
    get:
      tags: [auth]
      summary: Enroll the current session for TOTP two-factor authentication
      description: >
        Generates a fresh base32 TOTP secret, its otpauth URL (and recovery
        codes) for the calling session. Two-factor is not enabled yet: the
        first successful POST /auth/2fa/verify flips it on and issues a fresh
        recovery-code set.
      operationId: twoFaEnroll
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrollment material (secret, otpauth URL, one-time recovery codes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaEnrollResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/2fa/verify:
    post:
      tags: [auth]
      summary: Verify a TOTP code and enable two-factor authentication
      description: >
        First successful verification enables two-factor for the session and
        returns a fresh set of single-use recovery codes (plaintext is
        returned only this once). Subsequent calls fail with TWO_FA_ALREADY_ENABLED.
      operationId: twoFaVerify
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFaVerifyBody"
      responses:
        "200":
          description: Two-factor enabled; recovery codes returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaVerifyResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/2fa/verify-for-session:
    post:
      tags: [auth]
      summary: Verify a TOTP code and mint an mfa_verified session
      description: >
        Confirms an enabled TOTP secret and issues a fresh token pair whose
        access token carries the mfa_verified claim — the claim staff routes
        (/admin/*) require (AUTH.md RBAC).
      operationId: twoFaVerifyForSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFaVerifyBody"
      responses:
        "200":
          description: mfa_verified token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaSessionResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/2fa/disable:
    post:
      tags: [auth]
      summary: Disable two-factor authentication after a TOTP confirmation
      operationId: twoFaDisable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFaDisableBody"
      responses:
        "204": { description: Two-factor disabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/2fa/recovery:
    post:
      tags: [auth]
      summary: Recover a lost authenticator with a single-use recovery code
      description: >
        Consumes one recovery code (single-use; reuse fails with
        TWO_FA_RECOVERY_CODE_USED) and mints an mfa_verified token pair.
        The optional newPassword is reserved for a future password-reset
        extension and is not acted on by the current server.
      operationId: twoFaRecovery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFaRecoveryBody"
      responses:
        "200":
          description: mfa_verified token pair; the recovery code is consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFaSessionResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }


  /home:
    get:
      tags: [users]
      summary: Consumer BFF home feed (merchants, providers, promotions, availability in one response)
      operationId: getConsumerHome
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, schema: { type: number, format: float } }
        - { name: lon, in: query, schema: { type: number, format: float } }
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt]
                properties:
                  generatedAt: { type: string, format: date-time }
                  location:
                    type: object
                    properties:
                      city: { type: string }
                      serviceArea: { type: string }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCategoryConfig" }
                  merchants:
                    type: array
                    items: { $ref: "#/components/schemas/MerchantPublic" }
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderPublic" }
                  promotions:
                    type: array
                    items: { $ref: "#/components/schemas/Promotion" }
                  groupBuys:
                    type: array
                    items: { $ref: "#/components/schemas/GroupBuyDeal" }
                  recentOrders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  unreadCount: { type: integer }
                  membership: { $ref: "#/components/schemas/CustomerMembership" }

  /home/recommendations:
    get:
      tags: [users]
      summary: Personalized merchant recommendations (time, place, session, cold/warm start)
      operationId: getHomeRecommendations
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number, format: float } }
        - { name: lon, in: query, schema: { type: number, format: float } }
        - { name: limit, in: query, schema: { type: integer, default: 5, minimum: 1, maximum: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecommendedMerchant" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /search:
    get:
      tags: [users]
      summary: Unified search across all entity types
      operationId: unifiedSearch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: lat, in: query, schema: { type: number, format: float } }
        - { name: lon, in: query, schema: { type: number, format: float } }
        - { name: entityType, in: query, schema: { type: string, enum: [restaurant, dish, product, store, provider, service_package, hotel, deal, all], default: all } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: priceMaxTZS, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minRating, in: query, schema: { type: number, format: float, minimum: 0, maximum: 5 } }
        - { name: maxDistanceKm, in: query, schema: { type: number, format: float, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, rating, price_asc, price_desc, distance], default: relevance } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /search/suggest:
    get:
      tags: [users]
      summary: Autocomplete suggestions
      operationId: searchSuggest
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /search/history:
    delete:
      tags: [users]
      summary: Clear search history
      operationId: clearSearchHistory
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cleared }
    get:
      tags: [users]
      summary: Recent searches
      operationId: getSearchHistory
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /search/image:
    post:
      tags: [users]
      summary: Image search (PLANNED — placeholder endpoint)
      operationId: imageSearch
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl: { type: string, format: uri }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /coupon-campaigns:
    get:
      tags: [services]
      summary: Public active coupon campaigns (claimable)
      operationId: listPublicCouponCampaigns
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CouponCampaign" }

  /check-in:
    post:
      tags: [users]
      summary: Daily check-in (loyalty points)
      operationId: dailyCheckIn
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [pointsEarned, streakDays]
                properties:
                  pointsEarned: { type: integer }
                  streakDays: { type: integer }
                  bonusPoints: { type: integer, default: 0 }
        "409": { $ref: "#/components/responses/Conflict" }

  /loyalty-transactions:
    get:
      tags: [users]
      summary: Loyalty points ledger
      operationId: listLoyaltyTransactions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, type, points, balance, at]
                  properties:
                    id: { type: string, format: uuid }
                    type: { type: string, enum: [earn, redeem, check_in, bonus, expire, adjust] }
                    points: { type: integer, description: "Signed" }
                    balance: { type: integer }
                    reference: { type: string, nullable: true }
                    at: { type: string, format: date-time }

  /experiments:
    get:
      tags: [users]
      summary: Feature flags and experiments for the client
      operationId: listExperiments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [key, variant, rollout]
                  properties:
                    key: { type: string }
                    variant: { type: string }
                    rollout: { type: number, description: "0–1" }

  /users/me:
    get:
      tags: [users]
      summary: Current user profile with active role
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [users]
      summary: Update own profile
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/events:
    post:
      tags: [users]
      summary: Record a user behavior event for recommendations (view, search, cart, heart, order)
      operationId: postUserEvent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [view_merchant, search, cart_add, heart, order_paid, booking] }
                merchantId: { type: string, format: uuid, nullable: true }
                query: { type: string, maxLength: 200, nullable: true }
                cityId: { type: string, format: uuid, nullable: true }
                lat: { type: number, format: float, nullable: true }
                lon: { type: number, format: float, nullable: true }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/roles:
    get:
      tags: [users, auth]
      summary: List roles available to the user for role switching
      operationId: listMyRoles
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleSummary" }

  /cities:
    get:
      tags: [cities]
      summary: Cities and service areas
      operationId: listCities
      parameters:
        - { name: country, in: query, schema: { type: string, default: TZ } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/City" }

  /services:
    get:
      tags: [services]
      summary: Public service catalogue and categories
      operationId: listServices
      parameters:
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }

  /leads:
    post:
      tags: [public]
      summary: Submit a public signup or feedback lead (merchant, provider, rider, feedback)
      operationId: submitLead
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, status, receivedAt]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [received] }
                  receivedAt: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/ValidationError" }

  /merchants:
    get:
      tags: [merchants]
      summary: List merchants (public discovery, approved only)
      operationId: listMerchants
      parameters:
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MerchantPublic" }
    post:
      tags: [merchants]
      summary: Submit a merchant application (public lead or partner signup)
      operationId: applyMerchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantApplication"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"

  /merchants/{merchantId}:
    get:
      tags: [merchants]
      summary: Merchant public profile
      operationId: getMerchant
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantPublic"
        "404": { $ref: "#/components/responses/NotFound" }

  /merchants/me:
    get:
      tags: [merchants]
      summary: Own merchant profile and commercial terms
      operationId: getMyMerchant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantPrivate"
    patch:
      tags: [merchants]
      summary: Update own merchant profile
      operationId: updateMyMerchant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantPrivate"

  /providers:
    get:
      tags: [providers]
      summary: List providers (public discovery, approved only)
      operationId: listProviders
      parameters:
        - { name: cityId, in: query, schema: { type: string, format: uuid } }
        - { name: trade, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderPublic" }
    post:
      tags: [providers]
      summary: Submit a provider application
      operationId: applyProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderApplication"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"

  /providers/me:
    get:
      tags: [providers]
      summary: Own provider profile, schedule and payouts summary
      operationId: getMyProvider
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderPrivate"
    patch:
      tags: [providers]
      summary: Update own provider profile
      operationId: updateMyProvider
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderPrivate"

  /providers/me/availability:
    put:
      tags: [providers]
      summary: Set weekly availability and availability toggle
      operationId: setAvailability
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityWindow"
      responses:
        "204": { description: Saved }

  /riders:
    post:
      tags: [riders]
      summary: Submit a rider application
      operationId: applyRider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiderApplication"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"

  /riders/me:
    get:
      tags: [riders]
      summary: Own rider profile, vehicle and earnings summary
      operationId: getMyRider
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderPrivate"
    patch:
      tags: [riders]
      summary: Update own rider profile
      operationId: updateMyRider
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiderUpdate"
