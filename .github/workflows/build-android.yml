name: Build Android APKs (local, free)

# Builds installable Android APKs for all four HUDumika apps on the GitHub runner
# using `eas build --local` (runs inside an EAS Docker container). This does NOT
# consume the EAS cloud build quota, so it is free and unlimited.
# The public site (public-frontend /download) links to:
#   https://github.com/karibuyako/hudumika-platform/releases/latest/download/hudumika-<app>.apk
#
# Each app's metro.config.js aliases @faker-js/faker/msw into the app's
# node_modules so the workspace @hudumika/contract bundle resolves, and the
# preview profile in eas.json sets GRADLE_OPTS (daemon disabled, -Xmx3g) and
# NODE_OPTIONS (--max-old-space-size=2048) so the build fits the 7GB runner.
#
# PREREQUISITES (repo Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN  – Expo access token (still used by the eas CLI).
#
# HOW TO PUBLISH A NEW SET OF APKS:
#   git tag v1.0.0 && git push origin v1.0.0
# workflow_dispatch also builds the APKs as downloadable artifacts for testing.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: merchant
            app: merchant/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install deps at the workspace root so EAS can bundle the monorepo.
      # The root .npmrc sets legacy-peer-deps for the react-test-renderer peer
      # conflict.
      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Local build runs inside an EAS Docker container on the runner. Builds run
      # sequentially (max-parallel: 1) so the 7GB runner is not starved by
      # multiple Gradle/Metro processes at once.
      - name: Build Android APK locally
        working-directory: ${{ matrix.app }}
        run: |
          if eas build --local --platform android --profile preview --non-interactive > build.log 2>&1; then
            echo "Build succeeded"
          else
            echo "=== BUILD FAILED — tail of build log ==="
            tail -150 build.log
            exit 1
          fi

      - name: Locate and stage APK
        run: |
          APK=$(find "${{ matrix.app }}/android" -name '*.apk' -path '*release*' 2>/dev/null | head -n1)
          [ -z "$APK" ] && APK=$(find "${{ matrix.app }}" -name '*.apk' 2>/dev/null | head -n1)
          if [ -z "$APK" ]; then echo "::error::APK not found after local build"; exit 1; fi
          echo "Found APK: $APK"
          cp "$APK" "${{ github.workspace }}/hudumika-${{ matrix.name }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hudumika-${{ matrix.name }}-apk
          path: ${{ github.workspace }}/hudumika-${{ matrix.name }}.apk
          if-no-files-found: warn

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/hudumika-${{ matrix.name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
