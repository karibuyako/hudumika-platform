name: public-web

on:
  workflow_dispatch:
  pull_request:
    paths:
      - public-frontend/**
      - .github/workflows/public-web.yml
  push:
    branches:
      - main
    paths:
      - public-frontend/**
      - .github/workflows/public-web.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # public-frontend is a root workspace member with no own lockfile —
      # install at the workspace root, run scripts in the app folder.
      - name: Install
        run: npm ci
      - name: Typecheck
        working-directory: public-frontend
        run: npm run typecheck
      - name: Build
        working-directory: public-frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-frontend/dist --project-name=hudumika-public
