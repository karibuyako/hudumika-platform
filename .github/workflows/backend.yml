name: backend

on:
  pull_request:
    paths:
      - backend/**
  push:
    branches:
      - main
    paths:
      - backend/**

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/app/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
