name: rider

on:
  pull_request:
    paths:
      - rider-mobile/**
  push:
    branches:
      - main
    paths:
      - rider-mobile/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rider-mobile/app/package-lock.json
      - name: Install
        working-directory: rider-mobile/app
        run: npm ci
      - name: Typecheck
        working-directory: rider-mobile/app
        run: npm run typecheck
      - name: Test
        working-directory: rider-mobile/app
        run: npm test
      - name: Lint
        working-directory: rider-mobile/app
        run: npm run lint
